version: 2
updates:
  # GitHub Actions (pinned by SHA in .github/workflows: Dependabot updates the SHA and the version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # npm: minor and patch updates grouped in one weekly PR; majors stay separate.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    ignore:
      # Stay aligned with the Node major of the Dockerfile (node:22-alpine) and CI.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
