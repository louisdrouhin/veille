version: 2
updates:
  # GitHub Actions (pinned by SHA in .github/workflows: Dependabot updates the SHA and the version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Docker images, pinned by digest so that rebuilt base images (security fixes) come as PRs:
  # node in the Dockerfile, postgres in docker-compose.yml.
  # Majors are ignored: Node stays aligned with CI and @types/node, and a PostgreSQL
  # major upgrade needs a dump / restore of the data volume (done by hand).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    ignore:
      - dependency-name: postgres
        update-types:
          - version-update:semver-major

  # npm: minor and patch updates grouped in one weekly PR; majors stay separate.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    ignore:
      # Stay aligned with the Node major of the Dockerfile (node:22-alpine) and CI.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
