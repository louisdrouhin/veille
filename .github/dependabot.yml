version: 2
updates:
  # GitHub Actions (pinned by SHA in .github/workflows: Dependabot updates the SHA and the version comment).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # npm: minor and patch updates grouped in one weekly PR; majors stay separate.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
    groups:
      npm-minor-patch:
        update-types:
          - minor
          - patch
