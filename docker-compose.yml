# Fixed project name: the volumes (veille_db-data…) and containers keep it whatever the
# folder is called. The app is shown as « Folders »; do not change this or the database
# volume would be a new, empty one.
name: veille

# Log rotation for every service (docker logs keeps at most 3 × 10 MB per container).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-app-env: &app-env
  DATABASE_URL: postgres://${POSTGRES_USER:-veille}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@db:5432/${POSTGRES_DB:-veille}
  TZ: Europe/Paris

services:
  db:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-veille}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      POSTGRES_DB: ${POSTGRES_DB:-veille}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    # Image built, scanned and published by CI (.github/workflows/release.yml), one tag per version.
    # APP_VERSION (server .env) fixes the version: going back = setting the previous one again.
    # To build locally instead: docker-compose.build.yml.
    image: ghcr.io/louisdrouhin/veille:${APP_VERSION:?APP_VERSION manquant (version de l'image, ex. 2.13.0)}
    logging: *logging
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *app-env
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL manquant}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET manquant}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      FETCH_USER_AGENT: ${FETCH_USER_AGENT:-}
      # Optional: « Résumer » / « Traduire » (Gemini). Empty: the buttons are hidden.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-}
      GEMINI_TRANSLATE_MODEL: ${GEMINI_TRANSLATE_MODEL:-}
    ports:
      # Exposed to the existing reverse proxy (HTTPS is terminated upstream).
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-3000}:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/api/health/app').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  worker:
    image: ghcr.io/louisdrouhin/veille:${APP_VERSION:?APP_VERSION manquant (version de l'image, ex. 2.13.0)}
    logging: *logging
    restart: unless-stopped
    command: ["node", "dist/worker.js"]
    depends_on:
      # The app runs the migrations at startup: wait until it is healthy.
      app:
        condition: service_healthy
    environment:
      <<: *app-env
      FETCH_INTERVAL_MINUTES: ${FETCH_INTERVAL_MINUTES:-15}
      FETCH_CONCURRENCY: ${FETCH_CONCURRENCY:-4}
      FETCH_USER_AGENT: ${FETCH_USER_AGENT:-}
    stop_grace_period: 15s

  # Daily pg_dump (custom format) into ./backups, the 7 most recent kept: scripts/backup.sh.
  backup:
    image: postgres:17-alpine@sha256:f9cf3e1f0066f0eb0c48707d864f0ac5941e9ff454a072077d97a4d278d07d73
    logging: *logging
    restart: unless-stopped
    # Dumps owned by the host user (they hold password hashes: mode 600).
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    entrypoint: ["sh", "/usr/local/bin/veille-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-veille}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}
      PGDATABASE: ${POSTGRES_DB:-veille}
      TZ: Europe/Paris
      BACKUP_HOUR: ${BACKUP_HOUR:-3}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./scripts/backup.sh:/usr/local/bin/veille-backup.sh:ro
      - ./backups:/backups
    healthcheck:
      # Unhealthy when the newest dump is more than 26 h old.
      test: ["CMD-SHELL", "find /backups -name 'veille-*.dump' -mmin -1560 | grep -q ."]
      interval: 5m
      timeout: 10s
      start_period: 2m

volumes:
  db-data:
